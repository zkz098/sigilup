name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

env:
  CARGO_TERM_COLOR: always

jobs:
  warden:
    name: Warden (Static Checks & CI Parity)
    runs-on: ubuntu-latest
    env:
      WARDEN_VERSION: "0.2.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install cargo-warden
        run: |
          set -euo pipefail
          asset="cargo-warden-v${WARDEN_VERSION}-x86_64-unknown-linux-gnu"
          base="https://github.com/zkz098/cargo-warden/releases/download/v${WARDEN_VERSION}"
          curl -sSfL -o "$asset.tar.gz" "$base/$asset.tar.gz"
          curl -sSfL -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          grep -F "  $asset.tar.gz" SHA256SUMS.txt | sha256sum -c -
          tar -xzf "$asset.tar.gz"
          echo "$PWD/$asset" >> "$GITHUB_PATH"

      - name: Run cargo-warden static checks
        run: cargo warden check

  style:
    name: Code Style, Clippy & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Documentation check
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps --all-features

  test:
    name: Test (${{ matrix.os }})
    needs: [style]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check no_std core crate
        run: cargo check --locked -p sigilup-core --no-default-features --features alloc

      - name: Cargo check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      # Explicit workspace member list verified by `cargo warden ci-parity`
      - name: Run unit & integration tests (nextest)
        run: cargo nextest run --locked --profile ci -p sigilup-core -p sigilup-manifest -p sigilup -p sigilup-cli --all-targets --all-features

  coverage:
    name: Code Coverage (llvm-cov + nextest)
    needs: [style]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install nextest & cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage report
        run: |
          cargo llvm-cov nextest --locked -p sigilup-core -p sigilup-manifest -p sigilup -p sigilup-cli --all-features --no-fail-fast --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
